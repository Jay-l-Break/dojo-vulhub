services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:6.5.0@sha256:e0823ade6ccdc1275335c9f0a3721111abd01c964de577d648dc357bb8b858d1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      node.store.allow_mmapfs: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/ >/dev/null"]
      interval: 2s
      retries: 40

  backend:
    build: .
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
    ports:
      - "${DOJO_HOST_PORT:-80}:80"
