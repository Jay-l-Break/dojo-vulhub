services:
  backend:
    build: .
    environment:
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:-local-compose-django-005-db}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
    ports:
      - "${DOJO_HOST_PORT:-80}:80"
    depends_on:
      - db
  db:
    image: mysql:5.7@sha256:4bc6bc963e6d8443453676cae56536f4b8156d78bae03c0145cbe47c2aad73bb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-local-compose-django-005-db}
      MYSQL_DATABASE: cve
