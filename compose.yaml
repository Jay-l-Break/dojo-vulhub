services:
  backend:
    build: .
    environment:
      DB_HOST: db
      DB_USER: ${DB_USER:-system}
      DB_PASSWORD: ${DB_PASSWORD:-oracle}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
    ports:
      - "${DOJO_HOST_PORT:-80}:80"
    depends_on:
      - db
  db:
    image: vulhub/oracle:12c-ee@sha256:abe33a2b9fc36ad01d364ac61c87eadae90e3bf857c72bcc81de8480b037227f
    environment:
      INIT_MEM_PST: "1"
